name: Build Windows EXE (Transcritor de Vídeo)

on:
  push:
    branches:
      - claude/video-transcription-interface-85uuj2
    paths:
      - "transcritor-video/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: transcritor-video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar executável com PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "TranscritorDeVideo" `
            --collect-all numpy `
            --collect-all ctranslate2 `
            --collect-all av `
            --collect-all tokenizers `
            --collect-all faster_whisper `
            --collect-all huggingface_hub `
            --collect-all requests `
            --collect-all urllib3 `
            --collect-all certifi `
            --collect-all charset_normalizer `
            --collect-all idna `
            --collect-all filelock `
            --collect-all fsspec `
            --collect-all tqdm `
            --collect-all packaging `
            --collect-all yaml `
            --collect-all truststore `
            transcritor_video.py

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Transcritor de Vídeo (Windows) - build ${{ github.run_number }}"
          files: transcritor-video/dist/TranscritorDeVideo.exe
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
